services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - onlineshop_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # ПЕРЕОПРЕДЕЛЯЕМ переменные для Docker
      - ENVIRONMENT=docker
      - POSTGRES_HOST=db
    volumes:
      - .:/app
      - onlineshop_static:/app/staticfiles
      - onlineshop_media:/app/media
    depends_on:
      db:
        condition: service_healthy
    command: python manage.py runserver 0.0.0.0:8000
    networks:
      - app-network

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - /etc/letsencrypt/:/etc/letsencrypt/
      - onlineshop_static:/app/staticfiles
      - onlineshop_media:/app/media
    depends_on:
      - web
    networks:
      - app-network

volumes:
  onlineshop_postgres_data:
  onlineshop_static:
  onlineshop_media:

networks:
  app-network:
    driver: bridge