services:
  db:
    image: postgres:17-alpine
    container_name: onlineshop_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - onlineshop_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"      
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  migrate:
    build: .
    container_name: onlineshop_migrate
    command: python manage.py migrate --noinput
    env_file:
      - .env
    environment:
      - ENVIRONMENT=docker
      - POSTGRES_HOST=db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  web:
    build: .
    container_name: onlineshop_web
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=docker
      - POSTGRES_HOST=db
    volumes:
      - .:/app
      - onlineshop_static:/app/staticfiles
      - onlineshop_media:/app/media
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    command: python manage.py runserver 0.0.0.0:8000
    networks:
      - app-network

  nginx:
    image: nginx:latest
    container_name: onlineshop_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - /etc/letsencrypt/:/etc/letsencrypt/
      - onlineshop_static:/app/staticfiles
      - onlineshop_media:/app/media
    depends_on:
      - web
    networks:
      - app-network

volumes:
  onlineshop_postgres_data:
  onlineshop_static:
  onlineshop_media:

networks:
  app-network:
    driver: bridge